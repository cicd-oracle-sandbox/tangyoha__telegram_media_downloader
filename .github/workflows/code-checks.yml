name: Code Quality

on:
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'

permissions:
  contents: read

jobs:
  pre-commit:
    name: Linting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v3
      with:
        persist-credentials: false
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10.8'
    - name: Install dependencies
      run: make dev_install
    - uses: pre-commit/action@v3.0.0
