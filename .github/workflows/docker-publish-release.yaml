  #         RELEASE_DATE=$(date +%Y-%m-%d)
  #         echo "RELEASE_DATE=$RELEASE_DATE" | tee -a $GITHUB_ENV
  #         echo "release_date=$RELEASE_DATE" >> $GITHUB_OUTPUT

  #     - name: Generate changelog
  #       id: changelog
  #       run: |
  #         PREVIOUS_TAG=$(git describe --abbrev=0 --tags `git rev-list --tags --skip=1 --max-count=1`)
  #         CURRENT_TAG=${{ github.ref }}
  #         LOG=$(git log --pretty=format:'* %s by @%an in %H' $PREVIOUS_TAG...$CURRENT_TAG)
  #         echo "changelog=$LOG" >> $GITHUB_OUTPUT

  create_release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-tdl-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      VERSION: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Create release
        id: create_release
        run: |
          RELEASE_DATE=$(date +%Y-%m-%d)
          gh release create "${{ github.ref }}" \
            --title "${{ github.ref }},${RELEASE_DATE}" \
            --notes "Release ${{ github.ref }}" \
            --draft=false \
            --prerelease=false
          UPLOAD_URL=$(gh release view "${{ github.ref }}" --json uploadUrl --jq .uploadUrl)
          echo "upload_url=$UPLOAD_URL" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT
        shell: bash

  upload_assets:
    name: Upload release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: create_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        TARGET: [win64] #[macos, linux-amd64, win64]
    env:
      DISTPATH: tdl-${{ needs.create_release.outputs.VERSION }}-${{ matrix.TARGET }}
    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v4
      - name: Rename and package binaries
        run: |
          zip -r ${{ env.DISTPATH }}.zip ./tdl-${{ matrix.TARGET }}/*
      - name: Upload release assets
        id: upload-release-asset
        run: |
          gh release upload "${{ github.ref }}" "${{ env.DISTPATH }}.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
