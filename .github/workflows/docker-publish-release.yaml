name: Create Release and Upload Assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-tdl-binaries:
    name: Build tdl binaries for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [windows-latest] #[macos-latest, ubuntu-20.04, windows-latest]
        include:
        - os: macos-latest
          TARGET: macos
        - os: ubuntu-20.04
          TARGET: linux-amd64
        - os: windows-latest
          TARGET: win64
    container: ${{ matrix.CONTAINER }}
    env:
      DISTPATH: tdl-${{ matrix.TARGET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python3 -m pip install -r requirements.txt
          python3 gen_filter_cache.py
          pip install pyinstaller==6.7.0
      - name: Build with PyInstaller
        run: |
          pyinstaller --distpath ./${{ env.DISTPATH }} media_downloader.spec
      - name: Add license and readme
        shell: bash
        run: mv README_CN.md README.md ./${{ env.DISTPATH }}
      - name: Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DISTPATH }}
          path: ${{ env.DISTPATH }}

  create_release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-tdl-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      VERSION: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Create release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh release create "${{ github.ref }}" \
            --title "${{ github.ref }},${{ steps.release_date.outputs.release_date }}" \
            --notes "" \
            --draft=false \
            --prerelease=false
          echo "upload_url=$(gh api repos/${{ github.repository }}/releases/tags/${{ github.ref }} --jq .upload_url)" >> $GITHUB_OUTPUT
      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT
        shell: bash

  upload_assets:
    name: Upload release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: create_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        TARGET: [win64] #[macos, linux-amd64, win64]
    env:
      DISTPATH: tdl-${{ needs.create_release.outputs.VERSION }}-${{ matrix.TARGET }}
    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v4
      - name: Rename and package binaries
        run: |
          zip -r ${{ env.DISTPATH }}.zip ./tdl-${{ matrix.TARGET }}/*
      - name: Upload release assets
        id: upload-release-asset
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh release upload "${{ github.ref }}" "${{ env.DISTPATH }}.zip" --clobber
