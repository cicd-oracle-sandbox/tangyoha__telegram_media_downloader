name: Create Release and Upload Assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-tdl-binaries:
    name: Build tdl binaries for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [windows-latest] #[macos-latest, ubuntu-20.04, windows-latest]
        include:
        - os: macos-latest
          TARGET: macos
        - os: ubuntu-20.04
          TARGET: linux-amd64
        - os: windows-latest
          TARGET: win64
    container: ${{ matrix.CONTAINER }}
    env:
      DISTPATH: tdl-${{ matrix.TARGET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python3 -m pip install -r requirements.txt
          python3 gen_filter_cache.py
          pip install pyinstaller==6.7.0
      - name: Build with PyInstaller
        run: |
          pyinstaller --distpath ./${{ env.DISTPATH }} media_downloader.spec
      - name: Add license and readme
        shell: bash
        run: mv README_CN.md README.md ./${{ env.DISTPATH }}
      - name: Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DISTPATH }}
          path: ${{ env.DISTPATH }}

  # release:
  #   needs: build-tdl-binaries
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Check out code
